# =============================================================================
# Terminal
# =============================================================================
set -g default-terminal "xterm-256color"          # xterm with 256-color and OSC 11 support
set -ag terminal-overrides ",xterm-256color:RGB"  # Enable true color (24-bit)
set -s extended-keys on                           # Enable extended key sequences
set -as terminal-features 'xterm*:extkeys'
set -g allow-passthrough on                       # Allow OSC sequences to pass through (e.g. background color detection)

# =============================================================================
# General
# =============================================================================
set -s escape-time 0           # No delay after Escape (critical for vim)
set -g focus-events on         # Let apps detect focus change (triggers autoread)
set -g mouse on                # Mouse support (scroll, click pane/window)
set -g history-limit 50000     # Scrollback buffer size
set -g base-index 1            # Start window numbering at 1
setw -g pane-base-index 1      # Start pane numbering at 1
set -g renumber-windows on     # Close gaps when a window is closed
set -g display-panes-time 3000 # Pane numbers visible for 3s (C-b q)

# =============================================================================
# Status bar
# =============================================================================
set -g status-position top     # Status bar at the top
set -g status-left "[#S] "     # Show session name on the left
set -g status-left-length 30   # Prevent session name truncation
set -g status-right ""         # Nothing on the right
set -g status-style bg=default # Transparent status bar

# =============================================================================
# Windows
# =============================================================================
set -g status-justify centre                   # Center the window list
setw -g window-status-format         " #I:#W " # Inactive window: index:name
setw -g window-status-current-format " #I:#W "  # Active window: index:name
setw -g window-status-current-style reverse    # Invert active window colors
set -g main-pane-width 60%                     # Main pane takes 60% of width

# =============================================================================
# Pane borders
# =============================================================================
set -g pane-border-style        fg=colour238 # Inactive pane border (dark gray)
set -g pane-active-border-style fg=colour244 # Active pane border (light gray)

# =============================================================================
# Key bindings
# =============================================================================
bind s display-popup -E \
  "tmux list-sessions -F '#{session_name}' \
  | fzf --reverse \
  | xargs tmux switch-client -t"

bind w display-popup -E \
  "tmux list-windows -F '#{window_index}: #{window_name}' \
  | fzf --reverse \
  | xargs tmux select-window -t"

bind k run "~/.config/tmux/tmux_command_palette.sh"

# =============================================================================
# Copy mode
# =============================================================================
setw -g mode-keys vi # Vi keys in copy mode

bind -T copy-mode-vi v send -X begin-selection  # Start visual selection
bind -T copy-mode-vi V send -X select-line      # Select whole line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel          # Exit copy mode

set -g @clip "sh -c '\
    command -v pbcopy  >/dev/null && pbcopy  ||\
    command -v wl-copy >/dev/null && wl-copy ||\
    xclip -sel clip'"

bind -T copy-mode-vi y                 send -X copy-pipe-and-cancel "#{@clip}"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "#{@clip}"
